{% extends "base/base.html" %}

{% block layout %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); text-align: center;">
    <div style="max-width: 500px;">
        <div style="color: var(--color-error); margin-bottom: var(--space-4);">
            <i data-lucide="server-crash" style="width: 64px; height: 64px; margin: 0 auto;"></i>
        </div>
        <h1 style="font-size: var(--text-4xl); margin-bottom: var(--space-4);">Server Error</h1>
        <p class="text-secondary" style="margin-bottom: var(--space-8);">
            Something went wrong on our end. Our engineering team has been notified.
            Please try again later.
        </p>
        <a href="/" class="btn btn-primary">
            <i data-lucide="home"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
