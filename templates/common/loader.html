{% load static common_tags %}

<!-- Advance Billing — Master Premium Loading Screen Component -->
<div id="app-loader" class="app-loader-overlay theme-brand">
    <!-- Subtle Radial Background Glow -->
    <div class="loader-bg-glow"></div>

    <!-- Center Content -->
    <div class="loader-content-wrapper">
        <!-- Logo Badge with Soft Breathing Animation -->
        <div class="loader-logo-container">
            {% include "common/logo.html" with style="width: 56px; height: 56px; color: var(--color-brand-saffron, #FF7A00);" %}
        </div>

        <!-- Product Branding -->
        <h1 class="loader-title">{{ APP_NAME|default:"Advance Billing" }}</h1>
        <p class="loader-tagline">{{ APP_TAGLINE|default:"GST Billing Made Simple for Indian Businesses" }}</p>

        <!-- Receipt Print Progress Bar (No Spinners) -->
        <div class="loader-progress-track">
            <div class="loader-progress-bar"></div>
        </div>
    </div>
</div>
