<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Vintage Invoice/title>
        <style>
            @page {
                size: A4;
                margin: 0
            }

            * {
                box-sizing: border-box
            }

            html,
            body {
                margin: 0;
                padding: 0;
                background: #fff
            }

            body {
                font-family: Arial, Helvetica, sans-serif;
                color: #111
            }

            .page {
                position: relative;
                width: 210mm;
                height: 297mm;
                background: #fff;
                margin: 0 auto;
                font-size: 8px;
                line-height: 1.12
            }

            .invoice {
                position: absolute;
                left: 8.4mm;
                top: 8.2mm;
                width: 184.2mm;
                height: 237.5mm;
                border: 0.3mm solid #555;
                background: #fff
            }

            .top-title {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 6.2mm;
                border-bottom: .25mm solid #555
            }

            .tax-invoice {
                position: absolute;
                left: 0;
                top: 1.1mm;
                width: 100%;
                text-align: center;
                color: #183c70;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 1.7px
            }

            .original {
                position: absolute;
                right: 1.8mm;
                top: 1.7mm;
                font-size: 5px;
                letter-spacing: .35px
            }

            .header {
                position: absolute;
                left: 0;
                top: 6.2mm;
                width: 100%;
                height: 27.8mm;
                border-bottom: .25mm solid #555
            }

            .logo {
                position: absolute;
                left: 1.8mm;
                top: 1.8mm;
                width: 24.5mm;
                height: 24mm;
                object-fit: cover
            }

            .company {
                position: absolute;
                left: 28.5mm;
                top: 2mm;
                width: 58mm;
                font-size: 7.2px
            }

            .company .name {
                font-size: 9px;
                font-weight: 700;
                margin-bottom: 1mm
            }

            .company p {
                margin: .45mm 0
            }

            .invoice-meta {
                position: absolute;
                right: 0;
                top: 0;
                width: 92mm;
                height: 27.8mm;
                border-left: .25mm solid #555
            }

            .meta-cell {
                position: absolute;
                padding: 2.2mm 2mm;
                font-size: 7px
            }

            .meta-cell b {
                font-weight: 700
            }

            .meta-a {
                left: 0;
                top: 0;
                width: 46mm;
                height: 13.8mm;
                border-right: .25mm solid #555;
                border-bottom: .25mm solid #555
            }

            .meta-b {
                right: 0;
                top: 0;
                width: 46mm;
                height: 13.8mm;
                border-bottom: .25mm solid #555
            }

            .meta-c {
                left: 0;
                top: 13.8mm;
                width: 46mm;
                height: 14mm;
                border-right: .25mm solid #555
            }

            .meta-d {
                right: 0;
                top: 13.8mm;
                width: 46mm;
                height: 14mm
            }

            .customer {
                position: absolute;
                left: 0;
                top: 34mm;
                width: 100%;
                height: 27.5mm;
                border-bottom: .25mm solid #555
            }

            .customer-left {
                position: absolute;
                left: 0;
                top: 0;
                width: 50%;
                height: 100%;
                padding: 2mm;
                border-right: .25mm solid #555
            }

            .customer-right {
                position: absolute;
                right: 0;
                top: 0;
                width: 50%;
                height: 100%;
                padding: 2mm
            }

            .customer p {
                margin: .5mm 0;
                font-size: 7.2px
            }

            .customer .heading {
                font-weight: 700;
                font-size: 7.5px;
                margin-bottom: 1mm
            }

            .items {
                position: absolute;
                left: 0;
                top: 61.5mm;
                width: 100%;
                height: 61mm;
                border-collapse: collapse;
                table-layout: fixed;
                font-size: 7.4px
            }

            .items th {
                height: 5.4mm;
                border-right: .25mm solid #777;
                border-bottom: .25mm solid #555;
                font-size: 6.8px;
                font-weight: 700;
                padding: 1mm .7mm;
                text-align: center
            }

            .items td {
                border-right: .25mm solid #777;
                border-bottom: .25mm solid #999;
                padding: 1mm .8mm;
                vertical-align: top
            }

            .items th:last-child,
            .items td:last-child {
                border-right: 0
            }

            .items col:nth-child(1) {
                width: 5%
            }

            .items col:nth-child(2) {
                width: 31%
            }

            .items col:nth-child(3) {
                width: 12%
            }

            .items col:nth-child(4) {
                width: 13.5%
            }

            .items col:nth-child(5) {
                width: 9.5%
            }

            .items col:nth-child(6) {
                width: 12%
            }

            .items col:nth-child(7) {
                width: 12%
            }

            .items col:nth-child(8) {
                width: 5%
            }

            .center {
                text-align: center
            }

            .right {
                text-align: right;
                white-space: nowrap
            }

            .item2 {
                height: 47mm
            }

            .item-sub {
                font-size: 7px;
                margin-top: 1mm
            }

            .total-area {
                position: absolute;
                left: 0;
                top: 122.5mm;
                width: 100%;
                height: 42mm
            }

            .total-line {
                height: 4.7mm;
                border-bottom: .25mm solid #555;
                display: grid;
                grid-template-columns: 68% 32%;
                align-items: center;
                font-size: 7.2px
            }

            .total-line .label {
                padding-left: 2mm
            }

            .total-line .value {
                padding-right: 2mm;
                text-align: right;
                font-weight: 700
            }

            .total-main {
                height: 6.5mm;
                border-bottom: .25mm solid #555;
                display: grid;
                grid-template-columns: 68% 32%;
                align-items: center;
                font-size: 8.5px
            }

            .total-main .label {
                text-align: right;
                padding-right: 4mm;
                font-weight: 700
            }

            .total-main .value {
                text-align: right;
                padding-right: 2mm;
                font-size: 11px;
                font-weight: 700
            }

            .words {
                height: 6.5mm;
                border-bottom: .25mm solid #555;
                padding: 1.5mm 2mm;
                font-size: 7px
            }

            .tax-table {
                width: 100%;
                height: 18.5mm;
                border-collapse: collapse;
                table-layout: fixed;
                font-size: 7px
            }

            .tax-table th,
            .tax-table td {
                border-right: .25mm solid #777;
                border-bottom: .25mm solid #777;
                padding: 1mm 1.2mm
            }

            .tax-table th:last-child,
            .tax-table td:last-child {
                border-right: 0
            }

            .tax-table th {
                font-weight: 700;
                text-align: center
            }

            .tax-table td {
                text-align: right
            }

            .tax-table td:first-child {
                text-align: left
            }

            .tax-total td {
                font-weight: 700
            }

            .amount-paid {
                position: absolute;
                right: 2mm;
                bottom: -4mm;
                font-size: 7.5px;
                font-weight: 700
            }

            .amount-paid:before {
                content: "✓";
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 3.2mm;
                height: 3.2mm;
                border-radius: 50%;
                background: #1a9d50;
                color: #fff;
                margin-right: 1mm;
                font-size: 7px
            }

            .payment {
                position: absolute;
                left: 0;
                top: 164.5mm;
                width: 100%;
                height: 48mm;
                border-top: .25mm solid #555;
                border-bottom: .25mm solid #555
            }

            .bank {
                position: absolute;
                left: 0;
                top: 0;
                width: 50%;
                height: 100%;
                padding: 2.5mm;
                border-right: .25mm solid #555
            }

            .bank-title {
                font-weight: 700;
                margin-bottom: 2mm
            }

            .bank p {
                margin: 1mm 0;
                font-size: 7.5px
            }

            .upi {
                position: absolute;
                left: 50%;
                top: 0;
                width: 29.5%;
                height: 100%;
                padding-top: 1.8mm;
                border-right: .25mm solid #555;
                text-align: center
            }

            .upi-title {
                font-size: 7.5px;
                font-weight: 700
            }

            .qr {
                width: 27mm;
                height: 27mm;
                object-fit: cover;
                margin-top: 1.5mm
            }

            .sign {
                position: absolute;
                right: 0;
                top: 0;
                width: 20.5%;
                height: 100%;
                text-align: center;
                padding-top: 2mm
            }

            .sign-title {
                font-size: 7px
            }

            .signature {
                position: absolute;
                left: 1.5mm;
                top: 8mm;
                width: 31mm;
                height: 31mm;
                object-fit: cover
            }

            .authorized {
                position: absolute;
                bottom: 1.8mm;
                left: 0;
                width: 100%;
                font-size: 5.5px
            }

            .notes {
                position: absolute;
                left: 0;
                top: 212.5mm;
                width: 100%;
                height: 28.5mm
            }

            .notes-left {
                position: absolute;
                left: 0;
                top: 0;
                width: 50%;
                height: 100%;
                padding: 2mm;
                border-right: .25mm solid #555
            }

            .notes-right {
                position: absolute;
                right: 0;
                top: 0;
                width: 50%;
                height: 100%;
                padding: 2mm
            }

            .notes-title {
                font-weight: 700;
                font-size: 7.5px;
                margin-bottom: 1mm
            }

            .notes p {
                margin: 1mm 0;
                font-size: 7px
            }

            .notes ol {
                margin: 1mm 0 0 4mm;
                padding: 0;
                font-size: 6.8px
            }

            .notes li {
                margin: 1mm 0
            }

            .page-footer {
                position: absolute;
                left: 8.4mm;
                bottom: 7mm;
                width: 184.2mm;
                display: flex;
                justify-content: space-between;
                font-size: 6.5px
            }
        </style>
</head>
