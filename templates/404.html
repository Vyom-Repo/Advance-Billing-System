{% extends "base/base.html" %}

{% block layout %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); text-align: center;">
    <div style="max-width: 500px;">
        <h1 style="font-size: var(--text-6xl); color: var(--color-accent); margin-bottom: var(--space-4);">404</h1>
        <h2 style="margin-bottom: var(--space-4);">Page Not Found</h2>
        <p class="text-secondary" style="margin-bottom: var(--space-8);">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <a href="/" class="btn btn-primary">
            <i data-lucide="home"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
