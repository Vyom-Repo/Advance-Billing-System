{% extends "admin_portal/base.html" %}

{% block admin_css %}
<style>
    .admin-login-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(80vh - 64px);
    }
    .admin-login-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-xl);
        padding: var(--space-8);
        width: 100%;
        max-width: 420px;
        box-shadow: var(--shadow-lg);
    }
    .admin-login-header {
        text-align: center;
        margin-bottom: var(--space-6);
    }
    .admin-login-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: var(--radius-lg);
        background: rgba(217, 119, 6, 0.12);
        color: #d97706;
        margin-bottom: var(--space-3);
    }
    .admin-login-title {
        font-size: var(--text-xl);
        font-weight: var(--font-semibold);
        color: var(--color-text-primary);
    }
    .admin-login-subtitle {
        font-size: var(--text-xs);
        color: var(--color-text-secondary);
        margin-top: var(--space-1);
    }
    .admin-form-group {
        margin-bottom: var(--space-4);
    }
    .admin-form-group label {
        display: block;
        font-size: var(--text-xs);
        font-weight: var(--font-medium);
        color: var(--color-text-secondary);
        margin-bottom: var(--space-2);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .admin-input {
        width: 100%;
        padding: var(--space-3) var(--space-4);
        background: var(--color-background);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        color: var(--color-text-primary);
        font-size: var(--text-sm);
        transition: border-color var(--transition-fast);
    }
    .admin-input:focus {
        outline: none;
        border-color: #d97706;
    }
    .admin-submit-btn {
        width: 100%;
        padding: var(--space-3) var(--space-4);
        background: #d97706;
        color: #fff;
        border: none;
        border-radius: var(--radius-md);
        font-size: var(--text-sm);
        font-weight: var(--font-semibold);
        cursor: pointer;
        transition: background var(--transition-fast);
        margin-top: var(--space-2);
    }
    .admin-submit-btn:hover {
        background: #b45309;
    }
</style>
{% endblock %}

{% block admin_content %}
<div class="admin-login-wrap">
    <div class="admin-login-card">
        <div class="admin-login-header">
            <div class="admin-login-icon">
                <i data-lucide="shield-check" style="width:24px;height:24px;"></i>
            </div>
            <div class="admin-login-title">Admin Portal</div>
            <div class="admin-login-subtitle">Sign in with owner or administrator credentials</div>
        </div>

        <form method="post" action="{% url 'admin_portal:login' %}">
            {% csrf_token %}
            {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}

            <div class="admin-form-group">
                <label for="email">Admin Email / Username</label>
                <input type="text" id="email" name="email" class="admin-input" placeholder="admin or admin@advancebilling.in" value="{{ email|default:'' }}" required autofocus>
            </div>

            <div class="admin-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="admin-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="admin-submit-btn">
                Sign In to Admin Portal
            </button>
        </form>
    </div>
</div>
{% endblock %}
