databases:
  - name: advance-billing-db
    plan: free
    databaseName: advance_billing
    user: advance_user

services:
  - type: web
    name: advance-billing-web
    env: python
    plan: free
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --max-requests 50 --max-requests-jitter 10 --timeout 60"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advance-billing-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: RENDER
        value: "True"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: "core.settings.production"

