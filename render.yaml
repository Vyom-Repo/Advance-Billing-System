databases:
  - name: advance-billing-db
    plan: free
    databaseName: advance_billing
    user: advance_user

services:
  - type: web
    name: advance-billing-web
    runtime: python
    plan: free
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --max-requests 50 --max-requests-jitter 10 --timeout 60"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advance-billing-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: RENDER
        value: "True"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: REDIS_URL
        sync: false
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: "core.settings.production"
      - key: PYTHON_VERSION
        value: "3.12.8"

  - type: cron
    name: advance-billing-weekly-backup
    runtime: python
    plan: starter
    # Schedule: "0 2 * * 0" = Every Sunday at 02:00 UTC (07:30 AM IST)
    schedule: "0 2 * * 0"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_weekly_backups"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advance-billing-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "True"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: "core.settings.production"
      - key: PYTHON_VERSION
        value: "3.12.8"



